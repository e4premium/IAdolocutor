<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA DO LOCUTOR</title>
<link rel="icon" type="image/png" href="/logo-sm.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0f1117;--p1:#181b24;--p2:#1f2330;--bd:#2b3040;--tx:#e8ebf2;--mut:#8a92a6;--ac:#3b82f6;--ok:#22c55e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1b2340 0,var(--bg) 60%);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--bd);background:rgba(15,17,23,.7);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo img{height:90px;width:90px;object-fit:contain;filter:drop-shadow(0 0 10px #2f6bef88)}.logo span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.logo i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(#5b9bff,#2b63d9);box-shadow:0 3px 0 #1b3f93,inset 0 1px 0 #fff5;font-style:normal}
main{max-width:1100px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:1fr 330px;gap:18px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:linear-gradient(var(--p2),var(--p1));border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 12px 30px #0006,inset 0 1px 0 #ffffff0d}
.panel h2{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
textarea{width:100%;height:230px;resize:vertical;border:1px solid var(--bd);border-radius:12px;padding:14px;background:#0b0d13;color:var(--tx);font:17px/1.5 inherit;outline:0;box-shadow:inset 0 3px 8px #0008}
textarea:focus{border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.cnt{color:var(--mut);font-size:13px}
.btn{--c1:#5b9bff;--c2:#2f6bef;--sh:#1b3f93;border:0;border-radius:12px;padding:11px 20px;font:700 14px inherit;color:#fff;cursor:pointer;
 background:linear-gradient(var(--c1),var(--c2));box-shadow:0 5px 0 var(--sh),0 10px 16px #0007,inset 0 1px 0 #fff5;transition:transform .07s,box-shadow .07s;text-shadow:0 1px 1px #0005}
.btn:hover{filter:brightness(1.08)}.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--sh),0 3px 6px #0007,inset 0 1px 0 #fff4}
.btn:disabled{filter:grayscale(.7) brightness(.7);cursor:wait}
.gray{--c1:#4a5268;--c2:#353b4e;--sh:#1e2230}.green{--c1:#34d27b;--c2:#16a34a;--sh:#0c6a2e}.big{padding:14px 30px;font-size:16px}
.sm{padding:7px 12px;font-size:12px;border-radius:10px;box-shadow:0 3px 0 var(--sh),0 6px 10px #0006,inset 0 1px 0 #fff4}
.sm:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--sh),inset 0 1px 0 #fff4}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip.on{--c1:#5b9bff;--c2:#2f6bef;--sh:#1b3f93}
label{display:flex;justify-content:space-between;margin:18px 0 8px;font-size:13px;color:var(--mut)}label b{color:var(--tx)}
select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:#0b0d13;color:var(--tx);font-size:14px;box-shadow:inset 0 2px 6px #0008}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:#0b0d13;box-shadow:inset 0 2px 5px #000a;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(#7db0ff,#2f6bef);box-shadow:0 3px 0 #1b3f93,0 5px 8px #0008,inset 0 1px 0 #fff6;cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#3b82f6;border:0;box-shadow:0 3px 0 #1b3f93}
.wave{display:flex;align-items:center;gap:3px;height:34px;margin-top:16px;opacity:.5}
.wave span{flex:1;background:linear-gradient(var(--ac),#1d4ed8);border-radius:3px;height:20%}
.wave.on{opacity:1}.wave.on span{animation:w .8s ease-in-out infinite alternate}
@keyframes w{to{height:100%}}
#msg{color:#ff7b7b;font-size:13px;margin-top:10px;min-height:18px}
.item{background:#0b0d13;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px}
.item p{margin:0 0 6px;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{display:flex;gap:8px;align-items:center}.item audio{flex:1;height:34px;min-width:0}
.new{border-color:var(--ok);box-shadow:0 0 0 1px #22c55e55}
#hist{max-height:420px;overflow:auto}a.btn{text-decoration:none;display:inline-block}
body{overflow-x:hidden}
main>*,aside>*{min-width:0}
aside{grid-template-columns:minmax(0,1fr)}
.item{min-width:0;overflow:hidden}
/* Abas de locutores */
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:10px 8px;font-size:13px;border-radius:10px}
.tab.on{--c1:#5b9bff;--c2:#2f6bef;--sh:#1b3f93}
/* Demonstração da voz */
.demo{display:none;margin-top:12px;padding:12px;background:#0b0d13;border:1px solid var(--bd);border-radius:12px;box-shadow:inset 0 2px 6px #0008}
.demo.on{display:block}
.demo b{display:block;font-size:14px;margin-bottom:2px}
.demo small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.demo audio{width:100%;height:34px}
/* Compra de créditos */
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.mbox{width:100%;max-width:420px;max-height:92vh;overflow:auto}
.pac{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;text-align:left}
.pac span:last-child{font-size:15px}
#qr{background:#fff;padding:10px;border-radius:12px;width:fit-content;margin:14px auto}
#cc{height:76px;font-size:12px;padding:10px;word-break:break-all;resize:none}
.vlr{text-align:center;font-size:22px;font-weight:700;margin:6px 0}
.sub{text-align:center;color:var(--mut);font-size:13px}
</style></head><body>
<header><div class="logo"><img src="/logo.png" alt="IA do Locutor"><span>AS MELHORES VOZES</span></div><div style="display:flex;gap:10px;align-items:center"><span class="cnt" id="eu"></span><a class="btn gray sm" id="adm" href="/admin" style="display:none">Usuários</a><button class="btn green sm" id="comprar" style="display:none">+ Créditos</button><button class="btn gray sm" id="sair">Sair</button></div></header>
<main>
<section class="panel">
 <h2>Texto <span class="cnt" id="n">0 / 1000</span></h2>
 <textarea id="t" maxlength="1000" placeholder="Digite o texto que será falado..."></textarea>
 <div class="wave" id="wave"></div>
 <div class="row"><button class="btn gray" id="limpar">Limpar</button><button class="btn green big" id="g">▶ Gerar voz</button></div>
 <div id="msg"></div>
 <div id="atual"></div>
</section>
<aside style="display:grid;gap:18px;align-content:start">
 <div class="panel"><h2>Ajustes</h2>
  <label>Voz clonada</label>
  <div class="tabs" id="tabs"></div>
  <select id="v"></select>
  <div class="demo" id="demo"><b id="demoNome"></b><small>Demonstração da voz</small><audio id="demoAudio" controls preload="none"></audio></div>
  <label>Velocidade <b id="sv">1.00x</b></label><input id="s" type="range" min="0.5" max="2" step="0.05" value="1">
  <div class="chips" id="presets"></div>
  <label>Volume <b id="vv">0 dB</b></label><input id="vol" type="range" min="-10" max="10" step="1" value="0">
 </div>
 <div class="panel"><h2>Histórico</h2><div id="hist"></div></div>
</aside>
</main>
<div class="modal" id="modal"><div class="panel mbox">
 <h2>Comprar créditos <button class="btn gray sm" id="fechar">✕</button></h2>
 <div id="mcorpo"></div>
</div></div>
<script>
const $=i=>document.getElementById(i);
$('wave').innerHTML=Array.from({length:40},(_,i)=>`<span style="animation-delay:${(i%8)*.1}s;height:${20+Math.abs(Math.sin(i))*60}%"></span>`).join('');
[0.8,1,1.2,1.5].forEach(v=>{const b=document.createElement('button');b.className='btn gray sm chip';b.textContent=v+'x';b.onclick=()=>{$('s').value=v;upd()};$('presets').appendChild(b)});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const item=(h,novo,tag)=>`<div class="item${novo?' new':''}"><p>${tag?'<b>'+tag+'</b> · ':''}${esc(h.texto)||h.arquivo}</p><div class="r"><audio controls src="/saidas/${h.arquivo}"></audio><a class="btn sm" href="/saidas/${h.arquivo}" download>⬇</a></div></div>`;
function upd(){const s=+$('s').value;$('sv').textContent=s.toFixed(2)+'x';$('vv').textContent=$('vol').value+' dB';
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',parseFloat(c.textContent)===s))}
async function eu(){const j=await (await api('/api/eu')).json();$('eu').textContent=j.usuario+(j.limite?' · '+Math.max(0,j.limite-j.usados)+' créditos':'');$('adm').style.display=j.admin?'inline-block':'none';meuNome=j.usuario;$('comprar').style.display=j.limite?'inline-block':'none'}
async function api(u,o){const r=await fetch(u,o);if(r.status===401)location.reload();return r}
/* Demonstração da voz: toca o próprio arquivo da pasta /vozes */
function demo(){
 const a=$('demoAudio'),box=$('demo'),f=$('v').value;
 a.pause();
 if(!f){box.classList.remove('on');a.removeAttribute('src');return}
 $('demoNome').textContent=f.split('/').pop().replace(/\.[^.]+$/,'');
 a.onerror=()=>box.classList.remove('on');
 a.src='/vozes/'+encodeURIComponent(f);
 box.classList.add('on');
}
let escolha=null;try{escolha=localStorage.getItem('voz')}catch{}
$('v').onchange=()=>{escolha=$('v').value;try{localStorage.setItem('voz',escolha)}catch{};demo()};
let grupos={},aba=null;
const rotAba={masculina:'Masculina',feminina:'Feminina',outras:'Outras'},nm=f=>f.split('/').pop().replace(/\.[^.]+$/,'');
function desenhaAba(manual){
 const ks=['masculina','feminina','outras'].filter(g=>(grupos[g]||[]).length);
 $('tabs').innerHTML=ks.map(g=>`<button class="btn gray sm tab${g===aba?' on':''}" data-g="${g}">${rotAba[g]}</button>`).join('');
 $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{aba=b.dataset.g;desenhaAba(true)});
 const lista=grupos[aba]||[];
 $('v').innerHTML='<option value="">Voz padrão</option>'+lista.map(f=>`<option value="${esc(f)}">${esc(nm(f))}</option>`).join('');
 // ao trocar de aba, seleciona a 1ª voz dela; senão mantém a escolha salva
 if(manual||(escolha!==''&&!lista.includes(escolha)))escolha=lista[0]||'';
 $('v').value=escolha;
 try{localStorage.setItem('voz',escolha)}catch{}
 demo();
}
async function carregar(){
 const vz=await (await api('/api/vozes')).json();
 grupos=Array.isArray(vz)?{outras:vz}:vz;
 const ks=Object.keys(grupos).filter(g=>(grupos[g]||[]).length);
 if(!aba||!(grupos[aba]||[]).length){
  aba=ks.find(g=>(grupos[g]||[]).includes(escolha))||['masculina','feminina','outras'].find(g=>ks.includes(g))||'masculina';
 }
 if(escolha===null)escolha='';
 desenhaAba(false);
 const h=await (await api('/api/historico')).json();$('hist').innerHTML=h.map(x=>item(x)).join('')||'<p class="cnt">Nenhum áudio ainda.</p>';
}
$('t').oninput=()=>$('n').textContent=$('t').value.length+' / 1000';
$('s').oninput=$('vol').oninput=upd;
$('limpar').onclick=()=>{$('t').value='';$('n').textContent='0 / 1000';$('msg').textContent=''};
$('sair').onclick=async()=>{await fetch('/api/sair');location.reload()};
$('g').onclick=async()=>{
 $('msg').textContent='';$('g').disabled=true;$('g').textContent='Gerando...';$('wave').classList.add('on');
 try{
  const r=await api('/api/gerar',{method:'POST',body:JSON.stringify({texto:$('t').value,voz:$('v').value,velocidade:$('s').value,volume:$('vol').value})});
  const j=await r.json();if(!r.ok)throw new Error(j.erro);
  $('atual').innerHTML=item({arquivo:j.arquivo,texto:$('t').value},1);$('atual').querySelector('audio').play();carregar();eu();
 }catch(e){$('msg').textContent=e.message;if(/Créditos insuficientes/.test(e.message)){const b=document.createElement('button');b.className='btn green sm';b.style.marginLeft='10px';b.textContent='Comprar créditos';b.onclick=abrirCompra;$('msg').appendChild(b)}}
 $('g').disabled=false;$('g').textContent='▶ Gerar voz';$('wave').classList.remove('on');
};
let meuNome='';
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function fechar(){parar();$('modal').classList.remove('on')}
$('fechar').onclick=fechar;$('modal').onclick=e=>{if(e.target===$('modal'))fechar()};
$('comprar').onclick=abrirCompra;
async function abrirCompra(){
 parar();
 $('modal').classList.add('on');$('mcorpo').innerHTML='<p class="sub">Carregando...</p>';
 let info;try{info=await (await api('/api/pacotes')).json()}catch{$('mcorpo').innerHTML='<p class="sub">Não foi possível carregar. Tente novamente.</p>';return}
 if(!info.ativo){$('mcorpo').innerHTML='<p class="sub">A compra de créditos ainda não está disponível. Fale com o administrador.</p>';return}
 $('mcorpo').innerHTML='<p class="sub">Escolha um pacote e pague com PIX</p>'+info.pacotes.map((p,i)=>`<button class="btn gray pac" data-i="${i}"><span><b>${p.creditos.toLocaleString('pt-BR')}</b> créditos</span><span>${brl(p.valor)}</span></button>`).join('');
 $('mcorpo').querySelectorAll('.pac').forEach(b=>b.onclick=()=>info.modo==='auto'?comprarAuto(+b.dataset.i):pagar(+b.dataset.i,info));
}
let pollT=null;
function parar(){clearInterval(pollT);pollT=null}
async function comprarAuto(i){
 parar();$('mcorpo').innerHTML='<p class="sub">Criando pagamento...</p>';
 let r,j;try{r=await api('/api/comprar',{method:'POST',body:JSON.stringify({i})});j=await r.json()}catch{r={ok:false};j={}}
 if(!r.ok){$('mcorpo').innerHTML='<p class="sub">'+esc(j.erro||'Erro ao criar o pagamento')+'</p><div class="row"><button class="btn gray sm" id="volta">← Voltar</button></div>';$('volta').onclick=abrirCompra;return}
 try{localStorage.setItem('pedido',j.id)}catch{}
 aguardar(j.id,j.url);
}
function aguardar(id,url){
 $('mcorpo').innerHTML=(url?`<a class="btn green big" style="display:block;text-align:center" target="_blank" rel="noopener" href="${esc(url)}">Pagar agora · PIX ou cartão</a><p class="sub" style="margin-top:12px">Uma nova aba vai abrir com o pagamento seguro da InfinitePay.</p>`:'')+'<p class="sub" id="st" style="margin-top:14px">⏳ Aguardando a confirmação do pagamento...</p><p class="sub">Seus créditos são liberados automaticamente, não precisa fazer mais nada.</p>';
 parar();const ini=Date.now();
 pollT=setInterval(async()=>{
  if(Date.now()-ini>30*60e3){parar();return}
  let j={};try{j=await (await api('/api/pedido?id='+encodeURIComponent(id))).json()}catch{}
  if(j.status==='pago'){parar();try{localStorage.removeItem('pedido')}catch{}
   $('mcorpo').innerHTML=`<div class="vlr">✓ Pagamento confirmado!</div><p class="sub">${(j.creditos||0).toLocaleString('pt-BR')} créditos liberados na sua conta.</p><div class="row" style="justify-content:center"><button class="btn green" id="ok">Continuar</button></div>`;
   $('ok').onclick=fechar;eu()}
 },4000);
}
async function pagar(i,info){
 $('mcorpo').innerHTML='<p class="sub">Gerando PIX...</p>';
 const r=await api('/api/pix?i='+i),p=await r.json();
 if(!r.ok){$('mcorpo').innerHTML='<p class="sub">'+esc(p.erro||'Erro')+'</p>';return}
 const msg=encodeURIComponent('Olá! Paguei o PIX de '+brl(p.valor)+' ('+p.creditos.toLocaleString('pt-BR')+' créditos). Meu usuário: '+meuNome+'. Segue o comprovante.');
 $('mcorpo').innerHTML=`<div class="vlr">${brl(p.valor)}</div><p class="sub">${p.creditos.toLocaleString('pt-BR')} créditos</p>
  <div id="qr"></div>
  <p class="sub" style="margin:0 0 6px">PIX copia e cola</p>
  <textarea id="cc" readonly></textarea>
  <div class="row"><button class="btn gray sm" id="volta">← Voltar</button><button class="btn sm" id="copia">Copiar código</button></div>
  ${info.whatsapp?`<a class="btn green" style="display:block;text-align:center;margin-top:14px" target="_blank" rel="noopener" href="https://wa.me/${info.whatsapp}?text=${msg}">Já paguei · enviar comprovante</a>`:''}
  <p class="sub" style="margin-top:12px">Depois do pagamento, envie o comprovante. Seus créditos são liberados após a confirmação.</p>`;
 $('cc').value=p.copiaecola;
 if(window.QRCode)new QRCode($('qr'),{text:p.copiaecola,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});else $('qr').style.display='none';
 $('volta').onclick=abrirCompra;
 $('copia').onclick=async()=>{try{await navigator.clipboard.writeText(p.copiaecola)}catch{$('cc').select();document.execCommand('copy')}$('copia').textContent='Copiado ✓';setTimeout(()=>$('copia').textContent='Copiar código',2000)};
}
if(/[?&]pago=1/.test(location.search)){history.replaceState(null,'','/');let id=null;try{id=localStorage.getItem('pedido')}catch{}if(id){$('modal').classList.add('on');aguardar(id,'')}}
upd();carregar();eu();
</script></body></html>
